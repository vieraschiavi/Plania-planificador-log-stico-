name: CI
# NOTA: los triggers automáticos (push/pull_request) están desactivados a
# propósito: esta cuenta de GitHub hoy no asigna runners a los jobs de este
# repo privado (los runs mueren en 1-4 s con runner_id 0, sin logs), así que
# cada push marcaba una ✗ roja engañosa sin ejecutar nada del código.
#
# Para reactivar el CI automático cuando Actions esté destrabado
# (Settings → Billing → Spending limits de Actions, o repo Settings →
# Actions → General, o haciendo el repo público), reemplazá el bloque `on:`
# por:
#
#   on:
#     workflow_dispatch:
#     push:
#       branches: ["**"]
#     pull_request:
#
# Mientras tanto se puede correr a mano: pestaña Actions → CI → Run workflow.
on:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        # pyyaml: los tests leen render.yaml como YAML de verdad (no como
        # texto), para que una clave en el nivel equivocado del árbol se note
        # acá y no en un despliegue.
        run: pip install -r requirements.txt pytest httpx pyyaml
      - name: Generar base demo
        run: python data/generate_dataset.py --seed 42
      - name: Tests
        run: python -m pytest -q tests/
