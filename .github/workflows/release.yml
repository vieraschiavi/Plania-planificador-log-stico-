name: Release
# Construye los ejecutables descargables de Plania y los deja en INSTALADOR/
# (y, cuando corresponde, en la página de Releases del repo):
#
#   - Plania Setup X.exe         instalador Windows (Electron + React, backend
#                                Python embebido — el cliente no necesita nada)
#   - Plania X.exe               versión portable de la de Electron (sin instalación)
#   - Plania_Setup_vX.exe        instalador Windows liviano (Inno Setup, sin
#                                Electron/Chromium — abre en el navegador).
#                                Es el mismo archivo que sirve el backend de
#                                venta en /descargar/{token} tras el pago.
#   - Plania_portable.zip        bundle PyInstaller puro (sin Electron)
#   - Plania_BAT.zip             código + INICIAR_PLANIA.bat (requiere Python)
#
# Tres formas de disparar la corrida, con comportamiento distinto:
#
#   1. Push a main que toca app/, plania/, packaging/, desktop/, data/,
#      assets/, requirements.txt o INICIAR_PLANIA.bat — AUTOMÁTICO. Refresca
#      INSTALADOR/ con el binario más nuevo. NO publica en Releases: crear una
#      entrada de Release es una decisión de versión, no algo que tenga que
#      pasar en cada commit.
#   2. Push de un tag v* (ej. v1.0.0) — decisión humana de cortar una
#      versión. Refresca INSTALADOR/ Y publica en Releases, toque lo que
#      toque el commit (por eso el filtro de rutas de abajo NO se aplica acá:
#      ver el job `gate`, que evalúa esto con la API en vez de con `paths:`,
#      porque `paths:` a nivel de trigger se aplicaría también a los tags).
#   3. Actions → Release → "Run workflow" — igual que un tag, manual.
#
# El disparador automático (1) tiene un costo real: windows-latest en un repo
# privado consume minutos pagos a tarifa más alta que Linux, y cada corrida
# tarda bastante (Cython + PyInstaller + Electron). El job `gate` de abajo
# evita correrlo cuando el push no tocó nada que vaya al producto — pero si
# el ritmo de commits es alto, esto igual puede sumar. `concurrency` cancela
# la corrida vieja si llega un push más nuevo antes de que termine.
#
# Requiere que GitHub Actions tenga runners habilitados para este repo (ver
# nota en ci.yml) — eso no lo puede resolver este archivo. Si después de
# activar esto los pushes a main quedan con un ✗ que muere en segundos sin
# log, es ese problema y no el código: probá primero un "Run workflow" manual
# para confirmar que los runners están asignados.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (ej. 1.0.0)"
        default: "1.0.0"
        required: true
      # Para poder correr el build sobre una rama y ver si compila, sin que
      # eso deje binarios en la rama por defecto ni cree una entrada en
      # Releases. Construir y publicar son dos decisiones distintas; hasta
      # ahora una corrida manual hacía las dos sí o sí, así que verificar un
      # arreglo del instalador obligaba a publicarlo.
      solo_verificar:
        description: "Solo construir (no commitea INSTALADOR/ ni publica release)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
    branches: ["main"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Corre en Linux (barato) para decidir si hace falta prender el job de
  # windows-latest (caro). Un tag o un "Run workflow" manual SIEMPRE
  # construyen: son una decisión humana explícita. Un push a main solo
  # construye si tocó algo que va al producto empaquetado.
  #
  # Por qué esto no es un `paths:` en el trigger de arriba: `paths:` se
  # aplicaría a CUALQUIER push que matchee el trigger, incluidos los tags —
  # y un tag puesto sobre un commit que no cambió código (por ejemplo,
  # después de una tanda de commits de solo documentación) se saltearía
  # solo, sin avisar, justo cuando alguien decidió a propósito cortar una
  # versión. Evaluar la condición acá, con el listado de archivos del propio
  # evento, deja los tags sin filtrar y solo filtra los push a main.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decidir.outputs.build }}
    steps:
      - id: decidir
        uses: actions/github-script@v7
        with:
          script: |
            const tocaProducto = (archivo) => /^(app\/|plania\/|packaging\/|desktop\/|data\/|assets\/|requirements\.txt$|INICIAR_PLANIA\.bat$)/.test(archivo);

            if (context.eventName !== "push" || context.ref.startsWith("refs/tags/")) {
              core.setOutput("build", "si");
              core.info("Tag o workflow_dispatch: construye siempre.");
              return;
            }

            const commits = context.payload.commits || [];
            const archivos = commits.flatMap(c => [...(c.added || []), ...(c.removed || []), ...(c.modified || [])]);
            // Sin lista de archivos (payload inusual) no se puede afirmar que
            // NO tocó el producto, así que se construye para no arriesgar
            // dejar INSTALADOR/ desactualizado en silencio.
            const construir = commits.length === 0 || archivos.length === 0 || archivos.some(tocaProducto);

            core.info(`Archivos del push: ${archivos.join(", ") || "(ninguno reportado)"}`);
            core.setOutput("build", construir ? "si" : "no");
            if (!construir) {
              core.notice("Ningún archivo del producto cambió en este push. Sin build.");
            }

  ejecutables-windows:
    needs: gate
    # Fail-open a propósito: construye salvo que el gate haya dicho
    # explícitamente que NO hace falta.
    #
    # La primera versión de esto era `needs.gate.outputs.build == 'si'`, y en
    # la corrida real que disparó el merge del PR #25 el gate murió sin
    # ejecutarse (GitHub no le asignó runner: runner_id 0, sin logs). Con
    # aquella condición este job quedó en "skipped" — gris, indistinguible de
    # "no había nada que construir" — así que no hubo instalador y tampoco
    # hubo un error que lo explicara.
    #
    # Es la misma regla que ya usa el gate por dentro cuando no puede leer la
    # lista de archivos: si no se puede afirmar que NO hace falta construir,
    # se construye. Un build de más cuesta minutos; un build que falta en
    # silencio cuesta descubrir tarde que no hay nada para descargar.
    #
    # `!cancelled()` y no `always()`: si la corrida se canceló por
    # `concurrency` (llegó un push más nuevo), no hay que seguir.
    if: ${{ !cancelled() && needs.gate.outputs.build != 'no' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inno Setup (para el instalador liviano, sin Electron)
        # No viene preinstalado en la imagen windows-latest actual (Windows
        # Server 2025) — solo estaba en la 2022. Sin este paso,
        # build_release.py no encuentra ISCC.exe, lo saltea en silencio, y
        # dist/Plania_Setup_v*.exe (el mismo archivo que sirve el backend de
        # venta post-pago) nunca se genera.
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Revisar el instalador antes de construirlo
        # Barato y temprano: si al instalador le falta la opción de elegir
        # carpeta, un acceso directo, o el script tiene un error que sólo
        # aparece al compilar en Windows, es mejor saberlo antes de gastar
        # veinte minutos empaquetando algo que hay que rehacer.
        run: python packaging/verificar_instalador.py

      - name: Backend autocontenido (PyInstaller, código protegido con Cython)
        run: |
          pip install -r requirements.txt pyinstaller cython
          python packaging/build_release.py

      - name: Verificar que el motor quedo empaquetado
        shell: pwsh
        run: |
          # electron-builder copia dist/Plania como recurso del instalador. Si
          # PyInstaller falló, el instalador se arma igual pero sin motor: se
          # instala, abre y se queda en la pantalla de carga. Mejor romper el
          # build acá que publicar un instalador que no funciona.
          if (-not (Test-Path "dist/Plania/Plania.exe")) {
            Write-Error "No existe dist/Plania/Plania.exe - PyInstaller no dejo el motor."
            exit 1
          }
          $mb = [math]::Round((Get-ChildItem dist/Plania -Recurse |
                Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "[release] motor empaquetado: $mb MB"
          if ($mb -lt 80) {
            Write-Error "El motor pesa $mb MB: falta contenido (deberia rondar los cientos de MB)."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Escritorio Electron + React (instalador NSIS y portable)
        # npm ci en vez de npm install: instala exactamente lo que fija
        # package-lock.json. Sin lockfile (como estaba antes) cada corrida
        # podía traer una versión distinta de Electron o electron-builder
        # dentro de los rangos "^" del package.json, y un build que
        # funcionaba podía dejar de hacerlo sin que cambiara una sola línea
        # de código del repo.
        working-directory: desktop
        run: |
          npm ci
          npm run dist

      - name: Paquete BAT (codigo + lanzador, sin build)
        # La segunda vía de entrega, para las empresas donde IT no deja
        # ejecutar un .exe bajado de internet: mismo producto, arrancado con
        # un .bat y el Python del usuario. Es a propósito "código a la vista"
        # (INICIAR_PLANIA.bat corre plania/ tal cual, sin compilar nada).
        #
        # Justamente por eso el armado NO puede ser "copiar app/ y plania/
        # enteros": lo que entre acá se lee en la máquina del cliente. Quedan
        # afuera, y el paso siguiente lo verifica archivo por archivo:
        #
        #   - backend_venta/  el servidor de venta del Licenciante (licencias,
        #     checkout de MercadoPago). Nunca corre del lado del cliente.
        #   - el panel del dueño y lo que lo alimenta (app/owner.py,
        #     plania/owner.py, negocio.py, contenido.py): facturación,
        #     clientes, costos y márgenes del producto. Es la MISMA lista que
        #     packaging/proteger_codigo.py saca del .exe — hasta ahora el .exe
        #     los sacaba y este ZIP los mandaba igual, en texto plano.
        #   - docs/ interna (modelo comercial, análisis de negocio,
        #     comparativa, auditoría) y tests/, que no le sirven a un cliente.
        # Ya lo armó build_release.py más arriba (las dos vías salen del mismo
        # build). Acá se vuelve a abrir el ZIP terminado y se revisa archivo
        # por archivo, que es lo que de verdad importa.
        run: python packaging/armar_paquete_bat.py --verificar dist/Plania_BAT.zip
        shell: pwsh

      - name: Verificar que el instalador se genero
        shell: pwsh
        run: |
          $exes = Get-ChildItem desktop/dist_electron/*.exe -ErrorAction SilentlyContinue
          if (-not $exes) {
            Write-Error "electron-builder no dejo ningun .exe."
            exit 1
          }
          foreach ($e in $exes) {
            $mb = [math]::Round($e.Length / 1MB, 1)
            Write-Host "[release] $($e.Name)  $mb MB"
            # Un instalador sin el motor embebido pesa ~80 MB (solo Electron).
            # Con el motor supera los 250 MB.
            if ($mb -lt 150) {
              Write-Error "$($e.Name) pesa $mb MB: no tiene el motor adentro."
              exit 1
            }
          }

      # Los binarios NO se commitean al repositorio, y no es una preferencia:
      # es un límite duro de GitHub. La primera corrida que llegó hasta acá
      # terminó así:
      #
      #   remote: error: File INSTALADOR/Plania_portable.zip is 138.79 MB;
      #          this exceeds GitHub's file size limit of 100.00 MB
      #   ! [remote rejected] HEAD -> main (pre-receive hook declined)
      #
      # El portable pesa 138 MB y el Setup 99.7 MB — el segundo pasaba raspando
      # y se rompería solo en cuanto creciera un poco. Aunque entraran, cada
      # release sumaría ~240 MB al historial de git para siempre, y clonar el
      # repositorio se iría poniendo más lento con cada versión.
      #
      # Los archivos van a la página de Releases, que es el mecanismo de GitHub
      # para esto (hasta 2 GB por archivo) y no toca el historial. En
      # INSTALADOR/ queda lo que sí es chico y sí conviene versionar: los
      # sha256 y el índice con los links.
      - name: Calcular checksums e índice de descargas
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force INSTALADOR | Out-Null
          $setup = Get-ChildItem dist/Plania_Setup_v*.exe | Select-Object -First 1
          $electron = Get-ChildItem desktop/dist_electron/*.exe -ErrorAction SilentlyContinue
          $archivos = @()
          if ($setup) { $archivos += $setup }
          $archivos += $electron
          foreach ($n in @("Plania_portable.zip", "Plania_BAT.zip")) {
            if (Test-Path "dist/$n") { $archivos += Get-Item "dist/$n" }
          }

          # El panel del dueño NO se publica: lleva adentro la facturación, los
          # clientes y el modelo financiero. Si aparece entre lo que se va a
          # subir, es un error y el paso corta. Plania_Owner* cubre las dos
          # formas del panel: el .zip de PyInstaller y el Plania_Owner_BAT.zip
          # con el código y su .bat.
          $delDueno = $archivos | Where-Object { $_.Name -like "Plania_Owner*" }
          if ($delDueno) {
            Write-Error "$($delDueno.Name) no puede publicarse: es el panel del dueño."
            exit 1
          }

          $lineas = @("# sha256 de los archivos publicados en la página de Releases",
                      "# generado por .github/workflows/release.yml",
                      "# commit: $env:GITHUB_SHA")
          foreach ($a in $archivos) {
            $h = (Get-FileHash $a.FullName -Algorithm SHA256).Hash.ToLower()
            $mb = [math]::Round($a.Length / 1MB, 1)
            $lineas += "$h  $($a.Name)  ($mb MB)"
          }
          Set-Content INSTALADOR/CHECKSUMS.txt ($lineas -join "`n")
          Get-Content INSTALADOR/CHECKSUMS.txt

      # Se publica ANTES de commitear el índice, para que los links que ese
      # índice menciona ya existan cuando alguien los abra.
      - name: Publicar la última compilación (push automático a main)
        if: >-
          github.event_name == 'push' && github.ref_type != 'tag' &&
          inputs.solo_verificar != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-compilacion
          name: Última compilación
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            desktop/dist_electron/*.exe
            dist/Plania_Setup_v*.exe
            dist/Plania_portable.zip
            dist/Plania_BAT.zip
          body: |
            Compilación automática del último commit de `main`
            (${{ github.sha }}). Se reemplaza sola con cada cambio del producto.

            Para entregarle algo a un cliente, usá una versión cortada con tag
            (`git tag v1.0.1 && git push --tags`): esa queda fija y con
            changelog. Ésta cambia sin aviso.

            Los `sha256` están en
            [`INSTALADOR/CHECKSUMS.txt`](https://github.com/${{ github.repository }}/blob/main/INSTALADOR/CHECKSUMS.txt).

      # Solo el índice de texto (CHECKSUMS.txt), nunca los binarios: ver el
      # comentario del paso que los calcula.
      #
      # Y solo en las corridas que NO vienen de un tag: una corrida disparada
      # por un tag está parada en el commit de ese tag, que puede ser viejo, y
      # empujar eso a la rama por defecto la haría retroceder.
      - name: Commitear los checksums
        # `inputs` está vacío en los push, así que `inputs.solo_verificar` es
        # null y la condición se cumple: el disparo automático sigue igual.
        if: github.ref_type != 'tag' && inputs.solo_verificar != true
        shell: bash
        env:
          RAMA: ${{ github.event.repository.default_branch }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explícito y solo el .txt: `git add INSTALADOR/` con un -f volvería a
          # meter los binarios si algún día quedan en la carpeta.
          git add INSTALADOR/CHECKSUMS.txt
          if git diff --cached --quiet; then
            echo "Checksums sin cambios."
            exit 0
          fi
          git commit -m "sha256 de la última compilación"
          # Alguien pudo haber pusheado mientras el build corría (tarda varios
          # minutos): se rebasa antes de empujar en vez de fallar la corrida
          # entera después de haber compilado todo.
          git fetch origin "$RAMA"
          git rebase "origin/$RAMA"
          git push origin "HEAD:$RAMA"

      # Cortar una VERSIÓN es una decisión humana: un tag o un "Run workflow".
      # Los push automáticos también publican, pero sobre la entrada rodante
      # "ultima-compilacion" (paso de más arriba), que se pisa sola. Ésta queda
      # fija, con su número y su changelog: es la que se le pasa a un cliente.
      - name: Publicar release con las descargas
        if: >-
          github.ref_type == 'tag' ||
          (github.event_name == 'workflow_dispatch' && inputs.solo_verificar != true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          name: Plania ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          fail_on_unmatched_files: false
          files: |
            desktop/dist_electron/*.exe
            dist/Plania_Setup_v*.exe
            dist/Plania_portable.zip
            dist/Plania_BAT.zip
          body: |
            ## Descargas de Plania

            Dos formas de usar el mismo producto. Si tu empresa te deja
            ejecutar programas, bajá la primera. Si IT no deja abrir un `.exe`
            descargado —que pasa seguido—, bajá la última: es el mismo Plania
            arrancado con un `.bat` y el Python que ya tengas aprobado.

            **1 · Instalar (recomendado)**

            | Archivo | Qué hace |
            |---|---|
            | `Plania Setup *.exe` | Instala Plania con **ícono en el escritorio, entrada en el menú Inicio y desinstalador** en Agregar o quitar programas. Ventana propia (Electron + React), todo adentro: no necesitás instalar nada más. Elegís la carpeta. |

            **2 · Sin instalar**

            | Archivo | Qué hace | Requisitos |
            |---|---|---|
            | `Plania *.exe` (portable) | El mismo programa de arriba, sin instalación ni accesos directos. | ninguno |
            | `Plania_Setup_v*.exe` | Instalador liviano, sin Electron: se abre en tu navegador en vez de en ventana propia. También deja accesos directos y desinstalador. | ninguno |
            | `Plania_portable.zip` | Igual que el anterior pero sin instalar (doble clic en `Plania.exe`). | ninguno |
            | `Plania_BAT.zip` | Descomprimís y doble clic en `INICIAR_PLANIA.bat`. Prepara todo solo la primera vez. **Para las PC donde no se puede ejecutar un `.exe`.** | Python 3.11+ |

            En las cuatro primeras el código de negocio va compilado (Cython);
            en `Plania_BAT.zip` va a la vista, porque corre con tu Python.
            Ninguna de las cinco lleva el panel del dueño ni el servidor de venta.

            Demo de 7 días con todas las funciones al primer arranque, sin tarjeta.
            Uso sujeto a [LICENSE-EULA.md](https://github.com/${{ github.repository }}/blob/main/LICENSE-EULA.md).
