name: Release
# Construye los ejecutables descargables de Plania y los publica en la
# página de Releases del repo:
#
#   - Plania Setup X.exe        instalador Windows (Electron + React, backend
#                               Python embebido — el cliente no necesita nada)
#   - Plania X.exe              versión portable (sin instalación)
#   - Plania_portable.zip       bundle PyInstaller puro (sin Electron)
#   - Plania_BAT.zip            código + INICIAR_PLANIA.bat (requiere Python)
#
# Cómo generar una release: pestaña Actions → Release → "Run workflow"
# (o pushear un tag v1.0.0). Requiere que GitHub Actions tenga runners
# habilitados para este repo (ver nota en ci.yml).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (ej. 1.0.0)"
        default: "1.0.0"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ejecutables-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend autocontenido (PyInstaller)
        run: |
          pip install -r requirements.txt pyinstaller
          python packaging/build_release.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Escritorio Electron + React (instalador NSIS y portable)
        working-directory: desktop
        run: |
          npm install
          npm run dist

      - name: Paquete BAT (codigo + lanzador, sin build)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage/Plania -Force | Out-Null
          $items = @("app","plania","backend_venta","data","packaging","landing",
                     "docs","assets",".streamlit","tests","requirements.txt",
                     "run.sh","Procfile","README.md","INICIAR_PLANIA.bat")
          foreach ($i in $items) {
            if (Test-Path $i) { Copy-Item $i -Destination stage/Plania -Recurse -Force }
          }
          Compress-Archive -Path stage/Plania -DestinationPath dist/Plania_BAT.zip -Force

      - name: Publicar release con las descargas
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          name: Plania ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          fail_on_unmatched_files: false
          files: |
            desktop/dist_electron/*.exe
            dist/Plania_portable.zip
            dist/Plania_BAT.zip
          body: |
            ## Descargas de Plania

            | Archivo | Qué es | Requisitos |
            |---|---|---|
            | `Plania Setup *.exe` | Instalador Windows (Electron + React, todo incluido) | ninguno |
            | `Plania *.exe` (portable) | Igual al instalador pero sin instalar | ninguno |
            | `Plania_portable.zip` | Bundle PyInstaller (doble clic en `Plania.exe`) | ninguno |
            | `Plania_BAT.zip` | Código + `INICIAR_PLANIA.bat` autoinstalable | Python 3.11+ |

            Demo de 3 días con todas las funciones al primer arranque, sin tarjeta.
