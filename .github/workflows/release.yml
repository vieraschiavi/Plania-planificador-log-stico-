name: Release
# Construye los ejecutables descargables de Plania y los publica en la
# página de Releases del repo:
#
#   - Plania Setup X.exe         instalador Windows (Electron + React, backend
#                                Python embebido — el cliente no necesita nada)
#   - Plania X.exe               versión portable de la de Electron (sin instalación)
#   - Plania_Setup_vX.exe        instalador Windows liviano (Inno Setup, sin
#                                Electron/Chromium — abre en el navegador).
#                                Es el mismo archivo que sirve el backend de
#                                venta en /descargar/{token} tras el pago.
#   - Plania_portable.zip        bundle PyInstaller puro (sin Electron)
#   - Plania_BAT.zip             código + INICIAR_PLANIA.bat (requiere Python)
#
# Cómo generar una release: pestaña Actions → Release → "Run workflow"
# (o pushear un tag v1.0.0). Requiere que GitHub Actions tenga runners
# habilitados para este repo (ver nota en ci.yml).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (ej. 1.0.0)"
        default: "1.0.0"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ejecutables-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inno Setup (para el instalador liviano, sin Electron)
        # No viene preinstalado en la imagen windows-latest actual (Windows
        # Server 2025) — solo estaba en la 2022. Sin este paso,
        # build_release.py no encuentra ISCC.exe, lo saltea en silencio, y
        # dist/Plania_Setup_v*.exe (el mismo archivo que sirve el backend de
        # venta post-pago) nunca se genera.
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Backend autocontenido (PyInstaller)
        run: |
          pip install -r requirements.txt pyinstaller
          python packaging/build_release.py

      - name: Verificar que el motor quedo empaquetado
        shell: pwsh
        run: |
          # electron-builder copia dist/Plania como recurso del instalador. Si
          # PyInstaller falló, el instalador se arma igual pero sin motor: se
          # instala, abre y se queda en la pantalla de carga. Mejor romper el
          # build acá que publicar un instalador que no funciona.
          if (-not (Test-Path "dist/Plania/Plania.exe")) {
            Write-Error "No existe dist/Plania/Plania.exe - PyInstaller no dejo el motor."
            exit 1
          }
          $mb = [math]::Round((Get-ChildItem dist/Plania -Recurse |
                Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "[release] motor empaquetado: $mb MB"
          if ($mb -lt 80) {
            Write-Error "El motor pesa $mb MB: falta contenido (deberia rondar los cientos de MB)."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Escritorio Electron + React (instalador NSIS y portable)
        working-directory: desktop
        run: |
          npm install
          npm run dist

      - name: Paquete BAT (codigo + lanzador, sin build)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage/Plania -Force | Out-Null
          $items = @("app","plania","backend_venta","data","packaging",
                     "docs","assets",".streamlit","tests","requirements.txt",
                     "run.sh","Procfile","README.md","INICIAR_PLANIA.bat")
          foreach ($i in $items) {
            if (Test-Path $i) { Copy-Item $i -Destination stage/Plania -Recurse -Force }
          }
          Compress-Archive -Path stage/Plania -DestinationPath dist/Plania_BAT.zip -Force

      - name: Verificar que el instalador se genero
        shell: pwsh
        run: |
          $exes = Get-ChildItem desktop/dist_electron/*.exe -ErrorAction SilentlyContinue
          if (-not $exes) {
            Write-Error "electron-builder no dejo ningun .exe."
            exit 1
          }
          foreach ($e in $exes) {
            $mb = [math]::Round($e.Length / 1MB, 1)
            Write-Host "[release] $($e.Name)  $mb MB"
            # Un instalador sin el motor embebido pesa ~80 MB (solo Electron).
            # Con el motor supera los 250 MB.
            if ($mb -lt 150) {
              Write-Error "$($e.Name) pesa $mb MB: no tiene el motor adentro."
              exit 1
            }
          }

      - name: Publicar release con las descargas
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          name: Plania ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          fail_on_unmatched_files: false
          files: |
            desktop/dist_electron/*.exe
            dist/Plania_Setup_v*.exe
            dist/Plania_portable.zip
            dist/Plania_BAT.zip
          body: |
            ## Descargas de Plania

            | Archivo | Qué es | Requisitos |
            |---|---|---|
            | `Plania Setup *.exe` | Instalador Windows (Electron + React, todo incluido, ventana propia) | ninguno |
            | `Plania *.exe` (portable) | Igual al instalador de Electron pero sin instalar | ninguno |
            | `Plania_Setup_v*.exe` | Instalador Windows liviano (sin Electron, se abre en el navegador). Elegís dónde instalar. | ninguno |
            | `Plania_portable.zip` | Igual que el anterior pero sin instalar (doble clic en `Plania.exe`) | ninguno |
            | `Plania_BAT.zip` | Código + `INICIAR_PLANIA.bat` autoinstalable | Python 3.11+ |

            Demo de 7 días con todas las funciones al primer arranque, sin tarjeta.
